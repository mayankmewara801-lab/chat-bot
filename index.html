<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- DOMPurify for XSS Protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 20px; }
        
        /* Markdown Styles */
        .prose pre { background-color: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .prose code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875em; }
        .prose p { margin-bottom: 0.75rem; }
        .prose p:last-child { margin-bottom: 0; }
        
        /* Loader transition */
        #loading { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased selection:bg-blue-200 dark:selection:bg-blue-900">

    <!-- Fallback Loader -->
    <div id="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-gray-900">
        <div class="flex flex-col items-center space-y-4">
            <div class="w-10 h-10 border-4 border-gray-200 border-t-blue-500 rounded-full animate-spin"></div>
            <div class="text-lg font-medium text-gray-600 dark:text-gray-300">Loading App...</div>
        </div>
    </div>

    <!-- App Container (Mobile safe layout) -->
    <div id="app" class="flex min-h-[100dvh] w-full overflow-hidden hidden">
        
        <!-- Sidebar Overlay (Mobile) -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden transition-opacity"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:relative z-50 w-[280px] h-[100dvh] bg-gray-50 dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
            
            <div class="p-4 flex items-center justify-between">
                <button id="new-chat-btn" class="flex-1 flex items-center justify-center gap-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium py-2 px-4 rounded-lg transition-colors shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New Chat
                </button>
                <button id="close-sidebar-btn" class="md:hidden ml-2 p-2 text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="px-4 pb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Recent Chats</div>
            
            <!-- Chat List -->
            <div id="chat-list" class="flex-1 overflow-y-auto px-2 space-y-1">
                <!-- Dynamically populated -->
            </div>

            <!-- Sidebar Footer -->
            <div class="p-4 border-t border-gray-200 dark:border-gray-800 space-y-2">
                <button id="theme-toggle-btn" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg transition-colors">
                    <svg id="theme-icon-dark" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg id="theme-icon-light" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span id="theme-text">Toggle Theme</span>
                </button>
                <button id="settings-btn" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 h-[100dvh] bg-white dark:bg-gray-850">
            
            <!-- Mobile Header -->
            <header class="h-14 flex-shrink-0 flex items-center justify-between px-4 border-b border-gray-200 dark:border-gray-800 md:hidden bg-white dark:bg-gray-850">
                <button id="open-sidebar-btn" class="p-2 -ml-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div id="mobile-chat-title" class="text-sm font-medium text-gray-800 dark:text-gray-200 truncate px-2">New Chat</div>
                <div class="w-8"></div> <!-- Spacer for centering -->
            </header>

            <!-- Chat Messages -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 sm:p-6 scroll-smooth">
                <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center px-4">
                    <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900 rounded-2xl flex items-center justify-center mb-6 shadow-sm">
                        <svg class="w-8 h-8 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    </div>
                    <h2 class="text-2xl font-semibold mb-2 text-gray-800 dark:text-gray-100">How can I help you today?</h2>
                    <p class="text-gray-500 dark:text-gray-400 max-w-md">Configure your OpenRouter API key in settings, then type a message below to start.</p>
                </div>
                
                <div id="chat-thread" class="hidden max-w-3xl mx-auto space-y-6 pb-6">
                    <!-- Messages go here -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="flex-shrink-0 p-4 bg-white dark:bg-gray-850 border-t border-gray-100 dark:border-gray-800">
                <div class="max-w-3xl mx-auto relative flex items-end bg-gray-100 dark:bg-gray-800 rounded-2xl border border-transparent focus-within:border-gray-300 dark:focus-within:border-gray-600 shadow-sm overflow-hidden transition-colors duration-200">
                    <textarea id="chat-input" rows="1" class="w-full max-h-[200px] py-4 pl-4 pr-12 bg-transparent text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 outline-none resize-none" placeholder="Message AI..."></textarea>
                    <button id="send-btn" class="absolute right-2 bottom-2.5 p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
                <div class="text-center mt-2 text-xs text-gray-400 dark:text-gray-500">
                    Responses are generated by AI and may be inaccurate.
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-gray-900 w-full max-w-md rounded-2xl shadow-xl border border-gray-200 dark:border-gray-800 overflow-hidden transform scale-95 transition-transform duration-200">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                <h3 class="text-lg font-semibold">Settings</h3>
                <button id="close-settings-btn" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">OpenRouter API Key <span class="text-red-500">*</span></label>
                    <input type="password" id="api-key-input" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="sk-or-v1-...">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Model</label>
                    <input type="text" id="model-input" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" value="deepseek/deepseek-r1:free" placeholder="deepseek/deepseek-r1:free">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">System Prompt</label>
                    <textarea id="system-prompt-input" rows="3" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none" placeholder="You are a helpful AI assistant."></textarea>
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3 rounded-b-2xl">
                <button id="cancel-settings-btn" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancel</button>
                <button id="save-settings-btn" class="px-4 py-2 text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors shadow-sm">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- MAIN SCRIPT AT THE VERY END -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // === STATE MANAGEMENT ===
            let state = {
                chats: [],
                currentChatId: null,
                settings: {
                    apiKey: '',
                    model: 'deepseek/deepseek-r1:free',
                    systemPrompt: 'You are a highly capable AI assistant.'
                },
                isDark: false
            };

            // === DOM ELEMENTS ===
            const els = {
                loading: document.getElementById('loading'),
                app: document.getElementById('app'),
                sidebar: document.getElementById('sidebar'),
                sidebarOverlay: document.getElementById('sidebar-overlay'),
                chatList: document.getElementById('chat-list'),
                messagesContainer: document.getElementById('messages-container'),
                chatThread: document.getElementById('chat-thread'),
                emptyState: document.getElementById('empty-state'),
                chatInput: document.getElementById('chat-input'),
                sendBtn: document.getElementById('send-btn'),
                mobileChatTitle: document.getElementById('mobile-chat-title'),
                
                // Modals & Buttons
                settingsModal: document.getElementById('settings-modal'),
                settingsBtn: document.getElementById('settings-btn'),
                closeSettingsBtn: document.getElementById('close-settings-btn'),
                cancelSettingsBtn: document.getElementById('cancel-settings-btn'),
                saveSettingsBtn: document.getElementById('save-settings-btn'),
                newChatBtn: document.getElementById('new-chat-btn'),
                openSidebarBtn: document.getElementById('open-sidebar-btn'),
                closeSidebarBtn: document.getElementById('close-sidebar-btn'),
                themeToggleBtn: document.getElementById('theme-toggle-btn'),
                
                // Settings Inputs
                apiKeyInput: document.getElementById('api-key-input'),
                modelInput: document.getElementById('model-input'),
                systemPromptInput: document.getElementById('system-prompt-input'),
                
                // Icons
                themeIconDark: document.getElementById('theme-icon-dark'),
                themeIconLight: document.getElementById('theme-icon-light'),
                themeText: document.getElementById('theme-text')
            };

            // === INITIALIZATION ===
            function init() {
                loadData();
                applyTheme(state.isDark);
                if (state.chats.length === 0) createNewChat();
                else renderChatList();
                
                selectChat(state.currentChatId || state.chats[0]?.id);
                
                setupEventListeners();
                
                // Hide loader & show app
                els.loading.style.opacity = '0';
                setTimeout(() => {
                    els.loading.classList.add('hidden');
                    els.app.classList.remove('hidden');
                }, 300);
            }

            // === DATA PERSISTENCE ===
            function loadData() {
                try {
                    const savedChats = localStorage.getItem('ai_chats');
                    const savedSettings = localStorage.getItem('ai_settings');
                    const savedTheme = localStorage.getItem('ai_theme_dark');
                    const savedCurrentChatId = localStorage.getItem('ai_current_chat_id');

                    if (savedChats) state.chats = JSON.parse(savedChats);
                    if (savedSettings) state.settings = { ...state.settings, ...JSON.parse(savedSettings) };
                    if (savedTheme !== null) state.isDark = savedTheme === 'true';
                    if (savedCurrentChatId) state.currentChatId = savedCurrentChatId;
                } catch (e) {
                    console.error("Failed to load local storage", e);
                }
            }

            function saveData() {
                try {
                    localStorage.setItem('ai_chats', JSON.stringify(state.chats));
                    localStorage.setItem('ai_settings', JSON.stringify(state.settings));
                    localStorage.setItem('ai_theme_dark', state.isDark);
                    localStorage.setItem('ai_current_chat_id', state.currentChatId || '');
                } catch (e) {
                    console.error("Failed to save to local storage", e);
                }
            }

            // === THEME ===
            function applyTheme(isDark) {
                const html = document.documentElement;
                if (isDark) {
                    html.classList.add('dark');
                    els.themeIconLight.classList.remove('hidden');
                    els.themeIconDark.classList.add('hidden');
                    els.themeText.textContent = 'Light Mode';
                } else {
                    html.classList.remove('dark');
                    els.themeIconDark.classList.remove('hidden');
                    els.themeIconLight.classList.add('hidden');
                    els.themeText.textContent = 'Dark Mode';
                }
                state.isDark = isDark;
                saveData();
            }

            function toggleTheme() {
                applyTheme(!state.isDark);
            }

            // === CHAT MANAGEMENT ===
            function generateId() {
                return Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
            }

            function createNewChat() {
                const newChat = {
                    id: generateId(),
                    title: 'New Chat',
                    messages: [],
                    createdAt: Date.now()
                };
                state.chats.unshift(newChat);
                selectChat(newChat.id);
                saveData();
                renderChatList();
                if (window.innerWidth < 768) closeSidebar();
            }

            function selectChat(id) {
                if (!id) return;
                state.currentChatId = id;
                saveData();
                renderChatList();
                renderMessages();
            }

            function deleteChat(id, e) {
                e.stopPropagation();
                state.chats = state.chats.filter(c => c.id !== id);
                if (state.currentChatId === id) {
                    state.currentChatId = state.chats.length > 0 ? state.chats[0].id : null;
                    if (!state.currentChatId) createNewChat();
                    else selectChat(state.currentChatId);
                } else {
                    saveData();
                    renderChatList();
                }
            }

            function getCurrentChat() {
                return state.chats.find(c => c.id === state.currentChatId);
            }

            // === RENDERING ===
            function renderChatList() {
                els.chatList.innerHTML = '';
                state.chats.forEach(chat => {
                    const isActive = chat.id === state.currentChatId;
                    const div = document.createElement('div');
                    div.className = `group flex items-center justify-between p-2 rounded-lg cursor-pointer transition-colors ${isActive ? 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800'}`;
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'flex items-center overflow-hidden flex-1';
                    titleDiv.innerHTML = `
                        <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                        <span class="truncate text-sm font-medium">${DOMPurify.sanitize(chat.title)}</span>
                    `;
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = `p-1 text-gray-400 hover:text-red-500 rounded opacity-0 group-hover:opacity-100 transition-opacity ${isActive ? 'opacity-100' : ''}`;
                    deleteBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                    deleteBtn.onclick = (e) => deleteChat(chat.id, e);

                    div.onclick = () => {
                        selectChat(chat.id);
                        if (window.innerWidth < 768) closeSidebar();
                    };
                    
                    div.appendChild(titleDiv);
                    div.appendChild(deleteBtn);
                    els.chatList.appendChild(div);
                });
            }

            function renderMessages() {
                const chat = getCurrentChat();
                if (!chat) return;

                els.mobileChatTitle.textContent = chat.title;

                if (chat.messages.length === 0) {
                    els.emptyState.classList.remove('hidden');
                    els.chatThread.classList.add('hidden');
                } else {
                    els.emptyState.classList.add('hidden');
                    els.chatThread.classList.remove('hidden');
                    
                    els.chatThread.innerHTML = '';
                    chat.messages.forEach(msg => {
                        els.chatThread.appendChild(createMessageElement(msg));
                    });
                    scrollToBottom();
                }
            }

            function createMessageElement(msg) {
                const div = document.createElement('div');
                const isUser = msg.role === 'user';
                
                div.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;
                
                const bubble = document.createElement('div');
                bubble.className = `max-w-[85%] sm:max-w-[75%] rounded-2xl px-5 py-3.5 text-[15px] leading-relaxed shadow-sm ${
                    isUser 
                    ? 'bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-br-sm' 
                    : 'bg-white dark:bg-gray-850 text-gray-800 dark:text-gray-200 border border-gray-100 dark:border-gray-700/50 rounded-bl-sm'
                }`;

                if (isUser) {
                    bubble.textContent = msg.content; // Raw text for user
                } else {
                    // Render markdown and sanitize
                    const rawHtml = marked.parse(msg.content || '');
                    bubble.innerHTML = `<div class="prose dark:prose-invert max-w-none prose-sm sm:prose-base">${DOMPurify.sanitize(rawHtml)}</div>`;
                }

                div.appendChild(bubble);
                return div;
            }

            function scrollToBottom() {
                els.messagesContainer.scrollTop = els.messagesContainer.scrollHeight;
            }

            // === API INTERACTION ===
            async function sendMessage() {
                const content = els.chatInput.value.trim();
                if (!content) return;
                
                if (!state.settings.apiKey) {
                    alert("Please set your OpenRouter API Key in Settings first.");
                    openSettings();
                    return;
                }

                const chat = getCurrentChat();
                if (!chat) return;

                // Auto-generate title on first message
                if (chat.messages.length === 0) {
                    chat.title = content.length > 25 ? content.substring(0, 25) + '...' : content;
                    renderChatList();
                }

                // Add User Message
                chat.messages.push({ role: 'user', content });
                els.chatInput.value = '';
                els.chatInput.style.height = 'auto'; // Reset textarea height
                saveData();
                renderMessages();

                // UI Loading state
                els.chatInput.disabled = true;
                els.sendBtn.disabled = true;
                els.sendBtn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>';

                // Add Empty Assistant Message for Streaming
                const assistantMsg = { role: 'assistant', content: '' };
                chat.messages.push(assistantMsg);
                const assistantMsgEl = createMessageElement(assistantMsg);
                els.chatThread.appendChild(assistantMsgEl);
                scrollToBottom();

                const bubbleContentEl = assistantMsgEl.querySelector('.prose') || (function(){
                     const b = document.createElement('div');
                     b.className = "prose dark:prose-invert max-w-none prose-sm sm:prose-base";
                     assistantMsgEl.firstChild.appendChild(b);
                     return b;
                })();
                
                // Cursor logic
                let isStreaming = true;
                const updateDOM = () => {
                    const parsed = marked.parse(assistantMsg.content + (isStreaming ? ' ▍' : ''));
                    bubbleContentEl.innerHTML = DOMPurify.sanitize(parsed);
                    scrollToBottom();
                };

                try {
                    const payloadMessages = [
                        ...(state.settings.systemPrompt ? [{ role: 'system', content: state.settings.systemPrompt }] : []),
                        ...chat.messages.slice(0, -1) // Exclude the empty assistant one we just added
                    ];

                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${state.settings.apiKey}`,
                            'HTTP-Referer': window.location.href,
                            'X-Title': 'Universal AI Chat'
                        },
                        body: JSON.stringify({
                            model: state.settings.model || 'deepseek/deepseek-r1:free',
                            messages: payloadMessages,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error?.message || `HTTP ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line in buffer

                        for (const line of lines) {
                            if (line.trim() === '') continue;
                            if (line.includes('[DONE]')) break;
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    const textChunk = data.choices?.[0]?.delta?.content;
                                    if (textChunk) {
                                        assistantMsg.content += textChunk;
                                        updateDOM();
                                    }
                                } catch (e) {
                                    // Ignore partial JSON parse errors
                                }
                            }
                        }
                    }

                } catch (error) {
                    console.error("API Error:", error);
                    assistantMsg.content += `\n\n**Error:** ${error.message}`;
                    updateDOM();
                } finally {
                    isStreaming = false;
                    updateDOM(); // Remove cursor
                    saveData();
                    
                    els.chatInput.disabled = false;
                    els.sendBtn.disabled = false;
                    els.sendBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>';
                    els.chatInput.focus();
                }
            }

            // === SIDEBAR / MODAL CONTROLS ===
            function openSidebar() {
                els.sidebar.classList.remove('-translate-x-full');
                els.sidebarOverlay.classList.remove('hidden');
            }

            function closeSidebar() {
                els.sidebar.classList.add('-translate-x-full');
                els.sidebarOverlay.classList.add('hidden');
            }

            function openSettings() {
                els.apiKeyInput.value = state.settings.apiKey;
                els.modelInput.value = state.settings.model;
                els.systemPromptInput.value = state.settings.systemPrompt;
                
                els.settingsModal.classList.remove('hidden');
                // Small delay to allow CSS transform to trigger
                setTimeout(() => {
                    els.settingsModal.firstElementChild.classList.remove('scale-95');
                    els.settingsModal.firstElementChild.classList.add('scale-100');
                }, 10);
            }

            function closeSettings() {
                els.settingsModal.firstElementChild.classList.remove('scale-100');
                els.settingsModal.firstElementChild.classList.add('scale-95');
                setTimeout(() => {
                    els.settingsModal.classList.add('hidden');
                }, 200);
            }

            function saveSettings() {
                state.settings.apiKey = els.apiKeyInput.value.trim();
                state.settings.model = els.modelInput.value.trim() || 'deepseek/deepseek-r1:free';
                state.settings.systemPrompt = els.systemPromptInput.value.trim();
                saveData();
                closeSettings();
            }

            // === EVENT LISTENERS ===
            function setupEventListeners() {
                // Auto-resize textarea
                els.chatInput.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight) + 'px';
                });

                // Enter to send (Shift+Enter for new line)
                els.chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });

                els.sendBtn.addEventListener('click', sendMessage);
                
                els.newChatBtn.addEventListener('click', createNewChat);
                els.themeToggleBtn.addEventListener('click', toggleTheme);
                
                // Mobile Sidebar
                els.openSidebarBtn.addEventListener('click', openSidebar);
                els.closeSidebarBtn.addEventListener('click', closeSidebar);
                els.sidebarOverlay.addEventListener('click', closeSidebar);
                
                // Settings
                els.settingsBtn.addEventListener('click', openSettings);
                els.closeSettingsBtn.addEventListener('click', closeSettings);
                els.cancelSettingsBtn.addEventListener('click', closeSettings);
                els.saveSettingsBtn.addEventListener('click', saveSettings);
            }

            // Start App
            init();
        });
    </script>
</body>
</html>
